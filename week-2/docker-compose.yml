services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: statustracker
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"

  flask:
    build: .
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
      DATABASE_URL: postgresql://appuser:changeme@db:5432/statustracker
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"

