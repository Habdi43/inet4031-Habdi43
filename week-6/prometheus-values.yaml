# Settings for a lean Prometheus on a small single-node k3s VM.
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  retention: 2d
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
