apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ../week-2/docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: flask
  name: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ../week-2/docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: flask
    spec:
      containers:
        - env:
            - name: DATABASE_URL
              value: postgresql://appuser:changeme@db:5432/statustracker
            - name: POSTGRES_PASSWORD
              value: changeme
            - name: POSTGRES_USER
              value: appuser
          image: flask
          name: flask
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
